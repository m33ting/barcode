<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Barcode POS</title>

    <!-- Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        }

        /* SCANNER */

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .scan-title {
            text-align: center;
        }

        .last-scan {
            text-align: center;
            margin-top: 20px;
        }

        #barcode {
            font-size: 22px;
            font-weight: bold;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
        }

        /* MANUAL BARCODE */

        .manual {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .manual input {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        /* TOTAL */

        .total-box {
            text-align: center;
            margin: 20px 0;
        }

        .total-label {
            font-size: 18px;
            color: #777;
        }

        #total {
            font-size: 45px;
            font-weight: bold;
            color: #198754;
            margin-top: 5px;
        }

        /* TABLE */

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #222;
            color: white;
            padding: 12px 6px;
        }

        td {
            border-bottom: 1px solid #ddd;
            padding: 12px 5px;
            text-align: center;
        }

        .empty {
            padding: 30px;
            color: #777;
        }

        /* BUTTONS */

        button {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            font-size: 15px;
            cursor: pointer;
            margin: 2px;
        }

        button:hover {
            opacity: 0.85;
        }

        .blue {
            background: #007bff;
            color: white;
        }

        .green {
            background: #198754;
            color: white;
        }

        .red {
            background: #dc3545;
            color: white;
        }

        .dark {
            background: #343a40;
            color: white;
        }

        .yellow {
            background: #ffc107;
            color: #222;
        }

        .reset {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 17px;
        }

        /* QUANTITY */

        .quantity {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 18px;
            font-weight: bold;
        }

        /* ITEM COUNT */

        .basket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-count {
            background: #007bff;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* PAYMENT */

        .payment {
            border-top: 2px solid #eee;
            margin-top: 20px;
            padding-top: 20px;
        }

        .payment-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
        }

        .payment-row label {
            width: 130px;
            font-weight: bold;
        }

        #paymentTotal {
            font-size: 20px;
        }

        #change {
            font-size: 25px;
            font-weight: bold;
            color: #198754;
        }

        .payment-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        /* STATUS */

        #status {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-top: 15px;
            text-align: center;
        }

        .success-status {
            display: block !important;
            background: #d1e7dd;
            color: #0f5132;
        }

        .error-status {
            display: block !important;
            background: #f8d7da;
            color: #842029;
        }

        /* RECEIPT */

        #receipt {
            display: none;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            body {
                padding: 10px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px 3px;
            }

            .payment-row {
                flex-direction: column;
                align-items: stretch;
            }

            .payment-row label {
                width: auto;
            }

        }

        /* PRINT */

        @media print {

            body * {
                visibility: hidden;
            }

            #receipt,
            #receipt * {
                visibility: visible;
            }

            #receipt {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                padding: 5mm;
                background: white;
                color: black;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>📷 Barcode Scanner POS</h1>


    <div class="grid">


        <!-- =========================
             SCANNER
        ========================== -->

        <div>


            <div class="card">

                <h2 class="scan-title">
                    📷 Scan Barcode
                </h2>


                <div id="reader"></div>


                <div class="last-scan">

                    <h3>
                        Last Scanned Barcode
                    </h3>

                    <div id="barcode">
                        Waiting for scan...
                    </div>

                </div>


                <!-- MANUAL ENTRY -->

                <div class="manual">

                    <input
                        type="text"
                        id="manualBarcode"
                        placeholder="Enter barcode manually"
                        autocomplete="off"
                    >

                    <button
                        class="blue"
                        onclick="manualScan()"
                    >
                        Scan
                    </button>

                </div>


                <div id="status"></div>


            </div>


            <!-- =========================
                 PAYMENT
            ========================== -->

            <div class="card">

                <h2>💷 Payment</h2>


                <div class="payment">


                    <div class="payment-row">

                        <label>
                            Total:
                        </label>

                        <strong id="paymentTotal">
                            £0.00
                        </strong>

                    </div>


                    <div class="payment-row">

                        <label>
                            Cash received:
                        </label>

                        <input
                            type="number"
                            id="cashReceived"
                            min="0"
                            step="0.01"
                            placeholder="0.00"
                            oninput="calculateChange()"
                        >

                    </div>


                    <div class="payment-row">

                        <label>
                            Change:
                        </label>

                        <span id="change">
                            £0.00
                        </span>

                    </div>


                    <div class="payment-buttons">

                        <button
                            class="green"
                            onclick="completeSale()"
                        >
                            💰 Complete Sale
                        </button>


                        <button
                            class="dark"
                            onclick="printReceipt()"
                        >
                            🧾 Print Receipt
                        </button>

                    </div>


                </div>

            </div>


        </div>


        <!-- =========================
             BASKET
        ========================== -->

        <div>

            <div class="card">


                <div class="basket-header">

                    <h2>
                        🛒 Basket
                    </h2>

                    <span
                        class="item-count"
                        id="itemCount"
                    >
                        0 items
                    </span>

                </div>


                <div class="total-box">

                    <div class="total-label">
                        TOTAL
                    </div>

                    <div id="total">
                        £0.00
                    </div>

                </div>


                <table>

                    <thead>

                        <tr>

                            <th>
                                Barcode
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Quantity
                            </th>

                            <th>
                                Subtotal
                            </th>

                            <th>
                                Remove
                            </th>

                        </tr>

                    </thead>


                    <tbody id="items">

                        <tr>

                            <td
                                colspan="5"
                                class="empty"
                            >
                                Basket is empty
                            </td>

                        </tr>

                    </tbody>

                </table>


                <button
                    class="red reset"
                    onclick="resetPOS()"
                >
                    🔄 Reset Basket
                </button>


            </div>

        </div>


    </div>


</div>


<!-- =========================
     RECEIPT
========================== -->

<div id="receipt"></div>


<script>


/* =========================================
   BASKET
========================================= */

let basket = {};

let lastScan = "";

let saleNumber = 1;


/* =========================================
   RANDOM PRICE
========================================= */

function randomPrice() {

    /*
        Random price between £0.50
        and £20.00
    */

    return Number(
        (Math.random() * 19.50 + 0.50)
            .toFixed(2)
    );

}


/* =========================================
   BEEP
========================================= */

function beep() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.connect(gain);

        gain.connect(ctx.destination);


        oscillator.type =
            "square";


        oscillator.frequency.value =
            1000;


        gain.gain.value =
            0.1;


        oscillator.start();


        oscillator.stop(
            ctx.currentTime + 0.15
        );


    } catch (error) {

        console.log(
            "Audio unavailable"
        );

    }

}


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(
    message,
    type = "success"
) {

    const status =
        document.getElementById("status");


    status.textContent =
        message;


    if (type === "error") {

        status.className =
            "error-status";

    } else {

        status.className =
            "success-status";

    }


    setTimeout(() => {

        status.className = "";

    }, 2500);

}


/* =========================================
   SCAN SUCCESS
========================================= */

function scanSuccess(decodedText) {

    const barcode =
        String(decodedText).trim();


    if (!barcode) {
        return;
    }


    /*
       Prevent the scanner from adding
       the same scan many times instantly.
    */

    if (barcode === lastScan) {
        return;
    }


    lastScan = barcode;


    setTimeout(() => {

        lastScan = "";

    }, 1000);


    addToBasket(barcode);

}


/* =========================================
   ADD BARCODE TO BASKET
========================================= */

function addToBasket(barcode) {

    barcode =
        String(barcode).trim();


    document.getElementById("barcode")
        .textContent = barcode;


    beep();


    /*
       If barcode has never been scanned,
       generate a random price.
    */

    if (!basket[barcode]) {

        basket[barcode] = {

            price: randomPrice(),

            quantity: 1

        };


        showStatus(
            "New barcode added: " +
            barcode +
            " — £" +
            basket[barcode].price.toFixed(2)
        );


    } else {


        /*
           Same barcode:
           increase quantity.
        */

        basket[barcode].quantity++;


        showStatus(
            barcode +
            " quantity increased to " +
            basket[barcode].quantity
        );

    }


    updateBasket();

}


/* =========================================
   MANUAL SCAN
========================================= */

function manualScan() {

    const input =
        document.getElementById(
            "manualBarcode"
        );


    const barcode =
        input.value.trim();


    if (!barcode) {

        showStatus(
            "Please enter a barcode.",
            "error"
        );

        return;

    }


    addToBasket(barcode);


    input.value = "";

    input.focus();

}


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("manualBarcode")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                manualScan();

            }

        }
    );


/* =========================================
   GET TOTAL
========================================= */

function getTotal() {

    let total = 0;


    Object.keys(basket)
        .forEach(barcode => {

            const item =
                basket[barcode];


            total +=
                item.price *
                item.quantity;

        });


    return total;

}


/* =========================================
   UPDATE BASKET
========================================= */

function updateBasket() {

    const items =
        document.getElementById("items");


    items.innerHTML = "";


    let total = 0;

    let itemCount = 0;


    const barcodes =
        Object.keys(basket);


    if (barcodes.length === 0) {

        items.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    Basket is empty
                </td>

            </tr>

        `;

    }


    barcodes.forEach(barcode => {

        const item =
            basket[barcode];


        const subtotal =
            item.price *
            item.quantity;


        total += subtotal;

        itemCount += item.quantity;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                <strong>
                    ${escapeHTML(barcode)}
                </strong>
            </td>


            <td>
                £${item.price.toFixed(2)}
            </td>


            <td>

                <div class="quantity">

                    <button
                        class="red"
                        onclick="changeQuantity('${escapeJS(barcode)}', -1)"
                    >
                        −
                    </button>


                    <strong>
                        ${item.quantity}
                    </strong>


                    <button
                        class="green"
                        onclick="changeQuantity('${escapeJS(barcode)}', 1)"
                    >
                        +
                    </button>

                </div>

            </td>


            <td>
                £${subtotal.toFixed(2)}
            </td>


            <td>

                <button
                    class="red"
                    onclick="removeItem('${escapeJS(barcode)}')"
                >
                    🗑️
                </button>

            </td>

        `;


        items.appendChild(row);

    });


    document.getElementById("total")
        .textContent =
        "£" + total.toFixed(2);


    document.getElementById("paymentTotal")
        .textContent =
        "£" + total.toFixed(2);


    document.getElementById("itemCount")
        .textContent =
        itemCount +
        (itemCount === 1
            ? " item"
            : " items");


    calculateChange();

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQuantity(
    barcode,
    amount
) {

    if (!basket[barcode]) {
        return;
    }


    basket[barcode].quantity +=
        amount;


    if (
        basket[barcode].quantity <= 0
    ) {

        delete basket[barcode];

    }


    updateBasket();

}


/* =========================================
   REMOVE ITEM
========================================= */

function removeItem(barcode) {

    if (!basket[barcode]) {
        return;
    }


    delete basket[barcode];


    updateBasket();

}


/* =========================================
   RESET
========================================= */

function resetPOS() {

    basket = {};

    lastScan = "";


    document.getElementById("barcode")
        .textContent =
        "Waiting for scan...";


    document.getElementById(
        "cashReceived"
    ).value = "";


    document.getElementById("change")
        .textContent =
        "£0.00";


    updateBasket();

}


/* =========================================
   CALCULATE CHANGE
========================================= */

function calculateChange() {

    const total =
        getTotal();


    const cash =
        Number(
            document.getElementById(
                "cashReceived"
            ).value
        ) || 0;


    const change =
        Math.max(
            0,
            cash - total
        );


    document.getElementById("change")
        .textContent =
        "£" + change.toFixed(2);

}


/* =========================================
   COMPLETE SALE
========================================= */

function completeSale() {

    const total =
        getTotal();


    if (total <= 0) {

        showStatus(
            "Basket is empty.",
            "error"
        );

        return;

    }


    const cash =
        Number(
            document.getElementById(
                "cashReceived"
            ).value
        ) || 0;


    if (cash < total) {

        showStatus(
            "Not enough cash received.",
            "error"
        );

        return;

    }


    const change =
        cash - total;


    showStatus(
        "Sale completed! Change: £" +
        change.toFixed(2)
    );


    printReceipt();


    setTimeout(() => {

        resetPOS();

    }, 1500);

}


/* =========================================
   PRINT RECEIPT
========================================= */

function printReceipt() {

    const total =
        getTotal();


    if (total <= 0) {

        showStatus(
            "Basket is empty.",
            "error"
        );

        return;

    }


    const cash =
        Number(
            document.getElementById(
                "cashReceived"
            ).value
        ) || 0;


    const change =
        Math.max(
            0,
            cash - total
        );


    let receiptHTML = `

        <div style="
            font-family: Arial;
            font-size: 13px;
        ">

            <div style="
                text-align:center;
            ">

                <h2>MY SHOP</h2>

                <p>
                    BARCODE POS
                </p>

                <p>
                    Sale #${saleNumber}
                </p>

                <hr>

            </div>

    `;


    Object.keys(basket)
        .forEach(barcode => {

            const item =
                basket[barcode];


            const subtotal =
                item.price *
                item.quantity;


            receiptHTML += `

                <div style="
                    margin:8px 0;
                ">

                    <strong>
                        ${escapeHTML(barcode)}
                    </strong>

                    <br>

                    ${item.quantity}
                    × £${item.price.toFixed(2)}

                    <span style="
                        float:right;
                    ">
                        £${subtotal.toFixed(2)}
                    </span>

                </div>

            `;

        });


    receiptHTML += `

        <hr>

        <div style="
            display:flex;
            justify-content:space-between;
            font-weight:bold;
            font-size:16px;
        ">

            <span>
                TOTAL
            </span>

            <span>
                £${total.toFixed(2)}
            </span>

        </div>


        <div style="
            display:flex;
            justify-content:space-between;
            margin-top:8px;
        ">

            <span>
                CASH
            </span>

            <span>
                £${cash.toFixed(2)}
            </span>

        </div>


        <div style="
            display:flex;
            justify-content:space-between;
        ">

            <span>
                CHANGE
            </span>

            <span>
                £${change.toFixed(2)}
            </span>

        </div>


        <hr>


        <div style="
            text-align:center;
        ">

            <p>
                Thank you!
            </p>

            <p>
                ${new Date().toLocaleString()}
            </p>

        </div>

        </div>

    `;


    document.getElementById("receipt")
        .innerHTML =
        receiptHTML;


    window.print();


    saleNumber++;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   ESCAPE JAVASCRIPT
========================================= */

function escapeJS(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


/* =========================================
   START CAMERA SCANNER
========================================= */

const scanner =
    new Html5QrcodeScanner(
        "reader",
        {

            fps: 10,

            qrbox: {
                width: 280,
                height: 160
            },

            rememberLastUsedCamera: true

        },

        false
    );


scanner.render(
    scanSuccess,
    function(errorMessage) {

        /*
           Scanner continuously produces
           "not found" messages while searching.
           We intentionally don't display them.
        */

    }
);


/* =========================================
   INITIALISE
========================================= */

updateBasket();

</script>


</body>

</html>
